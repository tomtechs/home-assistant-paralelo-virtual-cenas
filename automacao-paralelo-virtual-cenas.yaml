alias: "Quarto Júlia - Paralelo virtual por cenas"
description: >
  Usa L2, L3 e L4 como seletores de cenas, mantendo o LED das
  teclas sincronizado com a cena selecionada.

triggers:

  # ============================================================
  # L2 - ESTUDAR
  # ============================================================

  - trigger: state
    entity_id: switch.interruptor_quarto_julia_l2
    from: "off"
    to: "on"
    id: estudar_ligar

  - trigger: state
    entity_id: switch.interruptor_quarto_julia_l2
    from: "on"
    to: "off"
    id: estudar_desligar

  # ============================================================
  # L3 - DORMIR
  # ============================================================

  - trigger: state
    entity_id: switch.interruptor_quarto_julia_l3
    from: "off"
    to: "on"
    id: dormir_ligar

  - trigger: state
    entity_id: switch.interruptor_quarto_julia_l3
    from: "on"
    to: "off"
    id: dormir_desligar

  # ============================================================
  # L4 - DESLIGAR TUDO
  # ============================================================

  - trigger: state
    entity_id: switch.interruptor_quarto_julia_l4
    from: "off"
    to: "on"
    id: tudo_desligado

conditions: []

actions:

  - choose:

      # ========================================================
      # L2 LIGADA - ATIVAR ESTUDAR
      # ========================================================

      - conditions:
          - condition: trigger
            id: estudar_ligar

        sequence:

          - action: switch.turn_off
            target:
              entity_id:
                - switch.interruptor_quarto_julia_l3
                - switch.interruptor_quarto_julia_l4

          - action: light.turn_off
            target:
              entity_id: light.led_cortineiro_julia

          - action: light.turn_on
            target:
              entity_id: light.led_teto_quarto_yasmin
            data:
              brightness_pct: 90
              color_temp_kelvin: 4500

      # ========================================================
      # L2 DESLIGADA - DESATIVAR ESTUDAR
      # ========================================================

      - conditions:
          - condition: trigger
            id: estudar_desligar

        sequence:

          - action: light.turn_off
            target:
              entity_id: light.led_teto_quarto_yasmin

      # ========================================================
      # L3 LIGADA - ATIVAR DORMIR
      # ========================================================

      - conditions:
          - condition: trigger
            id: dormir_ligar

        sequence:

          - action: switch.turn_off
            target:
              entity_id:
                - switch.interruptor_quarto_julia_l2
                - switch.interruptor_quarto_julia_l4

          - action: light.turn_off
            target:
              entity_id: light.led_teto_quarto_yasmin

          - delay:
              milliseconds: 300

          - action: light.turn_on
            target:
              entity_id: light.led_cortineiro_julia
            data:
              brightness_pct: 5

      # ========================================================
      # L3 DESLIGADA - DESATIVAR DORMIR
      # ========================================================

      - conditions:
          - condition: trigger
            id: dormir_desligar

        sequence:

          - action: light.turn_off
            target:
              entity_id: light.led_cortineiro_julia

      # ========================================================
      # L4 LIGADA - DESLIGAR TUDO
      # ========================================================

      - conditions:
          - condition: trigger
            id: tudo_desligado

        sequence:

          - action: switch.turn_off
            target:
              entity_id:
                - switch.interruptor_quarto_julia_l2
                - switch.interruptor_quarto_julia_l3

          - action: light.turn_off
            target:
              entity_id:
                - light.led_cortineiro_julia
                - light.led_teto_quarto_yasmin

mode: queued
max: 10
max_exceeded: silent
